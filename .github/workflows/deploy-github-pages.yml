# Public static builds must not receive provider API credentials.
# Kimi and Ark features remain disabled online until a server-side proxy is configured.
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set base path for GitHub Pages
        id: pages
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${REPO}/" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build
        env:
          GITHUB_PAGES_BASE: ${{ steps.pages.outputs.base }}
          KIMI_MODEL: ${{ secrets.KIMI_MODEL }}
          KIMI_API_BASE: ${{ secrets.KIMI_API_BASE }}
          KIMI_MOONSHOT_HOST: ${{ secrets.KIMI_MOONSHOT_HOST }}
          ARK_IMAGE_ENDPOINT: ${{ secrets.ARK_IMAGE_ENDPOINT }}
          ARK_IMAGE_MODEL: ${{ secrets.ARK_IMAGE_MODEL }}
          ARK_OUTFIT_MAX_REF_IMAGES: ${{ secrets.ARK_OUTFIT_MAX_REF_IMAGES }}
          VITE_OUTFIT_DEFAULT_CITY: ${{ secrets.VITE_OUTFIT_DEFAULT_CITY }}
          VITE_DOUYIN_PREVIEW_URL: ${{ secrets.VITE_DOUYIN_PREVIEW_URL }}
        run: npm run build

      - name: Push dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
