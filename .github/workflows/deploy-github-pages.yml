# 构建 Vite 产物并推送到 gh-pages 分支，供 GitHub Pages 使用。
# 仓库 Settings → Pages → Build and deployment → Source 选「Deploy from a branch」→ Branch 选 gh-pages / /(root)
#
# 在 Settings → Secrets and variables → Actions 中配置 Repository secrets（名称与本地 .env 一致）：
#   KIMI_API_KEY 或 MOONSHOT_API_KEY、ARK_API_KEY、KIMI_MOONSHOT_HOST 等；可选 KIMI_MODEL、VITE_* 等。
# 与 Vercel 相同：密钥会打进前端包，公开仓库时任何人可从静态资源中读取，请使用私有仓库或接受风险。

name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set base path for GitHub Pages
        id: pages
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${REPO}/" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build
        env:
          GITHUB_PAGES_BASE: ${{ steps.pages.outputs.base }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          KIMI_MODEL: ${{ secrets.KIMI_MODEL }}
          KIMI_API_BASE: ${{ secrets.KIMI_API_BASE }}
          KIMI_MOONSHOT_HOST: ${{ secrets.KIMI_MOONSHOT_HOST }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_IMAGE_ENDPOINT: ${{ secrets.ARK_IMAGE_ENDPOINT }}
          ARK_IMAGE_MODEL: ${{ secrets.ARK_IMAGE_MODEL }}
          ARK_OUTFIT_MAX_REF_IMAGES: ${{ secrets.ARK_OUTFIT_MAX_REF_IMAGES }}
          VITE_OUTFIT_DEFAULT_CITY: ${{ secrets.VITE_OUTFIT_DEFAULT_CITY }}
          VITE_DOUYIN_PREVIEW_URL: ${{ secrets.VITE_DOUYIN_PREVIEW_URL }}
        run: npm run build

      - name: Push dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
